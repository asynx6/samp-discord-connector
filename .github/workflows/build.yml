name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'master' 
    paths:
      - '**.hpp'
      - '**.cpp'
      - '**.h'
      - '**.c'
      - '**CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - 'master'
    paths:
      - '**.hpp'
      - '**.cpp'
      - '**.h'
      - '**.c'
      - '**CMakeLists.txt'
      - '.github/workflows/build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-20.04]
        build-type: [Debug, Release]
        include:
          - os: windows-latest
            cmake-args: '-G"Visual Studio 17 2022" -AWin32 -Thost=x86 -DGH_ACBUILD=TRUE  -DUSING_BOOST_NO_CONAN=TRUE -DUSING_OPENSSL_NO_CONAN=TRUE -DBoost_NO_BOOST_CMAKE=ON -DCONAN_SKIP_FMT=ON'
          - os: ubuntu-20.04
            cmake-args: '-DCMAKE_CXX_FLAGS=-m32 -DCMAKE_C_FLAGS=-m32 -DGH_ACBUILD=TRUE -DCONAN_SKIP_FMT=ON'

    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: ${{ matrix.build-type }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CONAN_AUTO_DETECT: '0'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set env
      run: echo "REPO_TAG=$(git describe --tags --always)" >> $GITHUB_ENV
      shell: bash
    
    - name: Install CMake 3.28 (Windows)
      if: runner.os == 'Windows'
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: 3.28.6
      continue-on-error: true
    
    - name: Install CMake (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake

    - if: runner.os == 'Windows'
      name: Install boost (from archives.boost.io)
      run: |
        $Url = "https://archives.boost.io/release/1.73.0/binaries/boost_1_73_0-msvc-14.2-64.exe"
        $Out = "$env:TEMP\boost.exe"
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        (New-Object System.Net.WebClient).DownloadFile($Url, $Out)
        Start-Process -Wait -FilePath $Out "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\\hostedtoolcache\\windows\\Boost"

    - if: runner.os == 'Windows'
      name: Set boost env
      run: echo "BOOST_ROOT=C:\\hostedtoolcache\\windows\\Boost" >> $GITHUB_ENV
      shell: bash

    - if: runner.os == 'Windows'
      name: Install openssl
      run: |
        $Url = "https://slproweb.com/download/Win32OpenSSL-1_1_1w.exe"
        $Out = "$env:TEMP\openssl.exe"
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        (New-Object System.Net.WebClient).DownloadFile($Url, $Out)
        Start-Process -Wait -FilePath $Out "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\\OpenSSL-Win32"

    - if: runner.os == 'Windows'
      name: Setup openssl envvar
      run: echo "OPENSSL_ROOT=C:\\OpenSSL-Win32" >> $GITHUB_ENV
      shell: bash
      
    - if: runner.os == 'Linux'
      name: Install gcc/g++-multilib
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt install gcc-9-multilib g++-9-multilib libstdc++-10-dev:i386

    - name: Get python
      uses: actions/setup-python@v5
      with:
        python-version: 3.9.0 # SemVer's version range syntax

    - name: Install conan 1.x and Ninja
      run: |
        python -m pip install --upgrade pip
        pip install 'conan<2'
        choco install ninja --no-progress || echo "Ninja install via choco failed"
        # Create Conan profile with v142 toolset for MSVC 19.5x compatibility
        conan profile new default --detect || true
        conan profile update settings.compiler.toolset=v142 default
        conan profile update settings.compiler.version=17 default
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Generate build files
      run: mkdir build && cd build && cmake .. ${{ matrix.cmake-args }} -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DDCC_VERSION=\"${{ env.REPO_TAG }}\" -DBOOST_ROOT=${{ env.BOOST_ROOT }} -DOPENSSL_ROOT=${{ env.OPENSSL_ROOT }}

    - if: runner.os == 'Windows'
      name: Build Windows
      run: cd build && cmake --build . --config ${{ matrix.build-type }}

    - if: runner.os == 'Linux'
      name: Build Linux
      run: cd build && cmake --build .
      

    - name: Zip artifact
      run: Compress-Archive ${{ runner.workspace }}/samp-discord-connector/build/artifact/* ${{ runner.workspace }}/samp-discord-connector/build/artifact/discord-connector-${{ env.REPO_TAG }}-${{ runner.os }}-${{ matrix.build-type }}.zip
      shell: pwsh
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: discord-connector-${{ env.REPO_TAG }}-${{ runner.os }}-${{ matrix.build-type }}
        path: ${{ runner.workspace }}/samp-discord-connector/build/artifact/discord-connector-${{ env.REPO_TAG }}-${{ runner.os }}-${{ matrix.build-type }}.zip